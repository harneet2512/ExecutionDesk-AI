<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExecutionDesk AI Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050816;
      --grid: rgba(71, 95, 160, 0.14);
      --panel: rgba(10, 15, 32, 0.82);
      --text: #f3f5fb;
      --muted: #96a0bf;
      --accent: #f8a317;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        radial-gradient(circle at 50% 22%, rgba(248, 163, 23, 0.18), transparent 26rem),
        var(--bg);
      background-size: 52px 52px, 52px 52px, auto, auto;
    }

    main {
      width: min(1280px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1.02;
    }

    p {
      margin: 14px 0 0;
      max-width: 780px;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.6;
    }

    .frame {
      margin-top: 28px;
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">ExecutionDesk AI</div>
    <h1>Always-on product demo</h1>
    <p>
      This page loads the animated showcase immediately at full size for direct sharing or GitHub Pages use.
    </p>
    <div class="frame">
      <img src="./media/executiondesk-main.gif" alt="ExecutionDesk AI animated product demo" />
    </div>
  </main>
</body>
</html>
